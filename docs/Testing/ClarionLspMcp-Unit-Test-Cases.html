<!DOCTYPE html>
<!--
  TEST-EXECUTION INSTRUMENT TEMPLATE (self-contained, offline, no network).
  Proven engine extracted from a real suite. To adapt it you edit ONLY the marked
  CUSTOMIZE blocks: SUITE_ID / SUITE_TITLE / SECTIONS / CASES / HEADER_FIELDS +
  matching freshState.header keys / SIGN_ROLES + matching freshState.signoff keys /
  renderPreamble text / the <title>, <h1>, <p class="sub">. Everything else is the
  generic engine — leave it alone. Keep the file fully inline (no <link>/CDN/fonts).
-->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clarion LSP MCP — Live Run Test Cases</title>
<style>
  :root{
    --paper:#f4efe1; --ink:#221f18; --maroon:#8a2b27; --meta-bg:#e9e1cd;
    --label:#6d5f4e; --value:#2b2820; --amber:#a8762b; --rule:#d8cdb2; --soft:#efe7d3;
    --ok:#3f6f3a; --bad:#8a2b27;   /* warnings reuse --amber */
    --serif:Georgia,'Times New Roman',serif;
    --mono:ui-monospace,'Cascadia Mono',Consolas,'Courier New',monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);padding:1.5rem;}
  .wrap{max-width:1100px;margin:0 auto;}
  h1{font-family:var(--serif);font-size:2rem;margin:0 0 .3rem;}
  .sub{font-style:italic;color:var(--label);margin:0 0 1.2rem;}
.case{background:var(--meta-bg);border-left:5px solid var(--maroon);border-radius:10px;
      padding:1rem 1.25rem;margin:1rem 0;}
.case h3{margin:0 0 .3rem;font-size:1.15rem;}
.case .pill{font-family:var(--mono);font-size:.66rem;font-weight:700;text-transform:uppercase;
      border:1px solid currentColor;border-radius:999px;padding:.08rem .5rem;margin-left:.5rem;}
.pill.CORE{color:var(--maroon);} .pill.HIGH{color:var(--amber);} .pill.MED{color:var(--label);}
.chip{font-family:var(--mono);font-size:.66rem;font-weight:700;border:1px solid currentColor;
      border-radius:999px;padding:.08rem .5rem;margin-left:.5rem;color:var(--label);}
.chip.PASS{color:var(--ok);} .chip.FAIL{color:var(--bad);} .chip.BLOCKED{color:var(--amber);} .chip.NA{color:var(--label);}
.case .ro{font-size:.92rem;margin:.35rem 0;}
.case .ro b{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;color:var(--label);}
.steplist{list-style:none;padding-left:0;margin:.4rem 0;}
.steplist li{margin:.2rem 0;font-size:.95rem;}
.verdict label{margin-right:1rem;font-family:var(--mono);font-size:.85rem;}
.case textarea{width:100%;font-family:var(--mono);font-size:.82rem;margin-top:.3rem;
      border:1px solid var(--rule);border-radius:6px;padding:.4rem;background:#fbf7ec;}
.flag{display:inline-block;font-family:var(--mono);font-size:.72rem;color:var(--amber);
      border:1px solid var(--amber);border-radius:5px;padding:.05rem .4rem;margin-left:.5rem;}
.escaped{white-space:pre-wrap;}
.stepcount{font-family:var(--mono);font-size:.72rem;color:var(--label);margin-left:.5rem;}
.stepcount.full{color:var(--ok);}
.runhdr{background:var(--soft);border:1px solid var(--rule);border-radius:10px;padding:1rem;margin:1rem 0;}
.hgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.6rem;}
.hf{display:flex;flex-direction:column;font-family:var(--mono);font-size:.72rem;color:var(--label);}
.hf input{font-size:.9rem;padding:.3rem;border:1px solid var(--rule);border-radius:5px;background:#fbf7ec;}
.hstatus{margin-top:.6rem;font-family:var(--mono);font-size:.8rem;}
#saveStatus.ok{color:var(--ok);} #saveStatus.warn-text{color:var(--bad);font-weight:700;}
.resume{color:var(--amber);margin-right:1rem;}
.signtbl input{width:100%;font-family:var(--mono);font-size:.85rem;padding:.25rem;border:1px solid var(--rule);border-radius:5px;}
h2.sec{font-size:1.3rem;border-bottom:2px solid var(--maroon);padding-bottom:.3rem;margin:1.5rem 0 .5rem;}
details.pre{background:var(--soft);border:1px solid var(--rule);border-radius:10px;
      padding:.6rem 1rem;margin:1rem 0;}
details.pre summary{cursor:pointer;font-weight:700;}
.notice{background:#f6e7c8;border:1px solid var(--amber);border-radius:8px;padding:.7rem 1rem;
      margin:.8rem 0;font-family:var(--mono);font-size:.85rem;}
.notice button{margin-left:.6rem;font-family:var(--mono);cursor:pointer;}
.dash{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:2px solid var(--maroon);
      padding:.6rem 0;margin-bottom:1rem;}
#counts{font-family:var(--mono);font-size:.85rem;}
.bar{height:8px;background:var(--rule);border-radius:4px;margin:.4rem 0;overflow:hidden;}
#barFill{height:100%;background:var(--amber);width:0;transition:width .2s;}
.dashctl{font-family:var(--mono);font-size:.82rem;}
.dashctl select,.dashctl button{font-family:var(--mono);font-size:.8rem;margin-left:.4rem;
      padding:.25rem .6rem;border:1px solid var(--maroon);border-radius:6px;background:var(--meta-bg);cursor:pointer;}
/* BRAND-REPORT-CSS:BEGIN — refreshed from skills/dollar-tree-branding/brand-report.css */
/* Canonical DT report stylesheet — every rule #report-scoped so it can never
   restyle instrument house screens. Token values MUST mirror brand.css
   (parity-guarded). Repo + payload file; refreshed into instruments via
   marked blocks per the dollar-tree-branding skill. */

#report{
  --brand-green:#009639;
  --brand-green-dark:#007a2f;
  --brand-green-light:#6CC24A;
  --brand-green-link:#12823b;
  --brand-green-header:#00953a;
  --brand-blue:#0033a1;
  --brand-blue-soft:#e8eefb;
  --brand-blue-line:#c3d2f0;
  --brand-orange:#ED8B00;
  --brand-red:#DA291C;
  --brand-gray-d:#4C4C4D;
  --brand-gray-l:#DDDDDD;
  --brand-text:#333333;
  --brand-bg:#faf8f2;
  --brand-soft:#f3efe6;
  --brand-green-soft:#e6f4ea;
  --brand-line:#dcdedd;
  --brand-muted:#5a6b62;
  --brand-black:#231F20;
  --warn-soft:#fdf0d9;
  --warn-line:#f3d39a;
  --danger-soft:#fbe6e4;
  --danger-line:#f1c2bd;
}

/* --- Base --- */
#report .rpt{font-family:Futura,'Century Gothic','Calibri','Segoe UI',Arial,sans-serif;color:var(--brand-text);}

/* --- Masthead --- */
#report .rpt-hd{background:var(--brand-green);color:#fff;text-align:center;padding:22px 16px;border-bottom:4px solid var(--brand-green-light);}
#report .rpt-wm{display:inline-block;border:2px solid rgba(255,255,255,.85);border-radius:6px;padding:6px 15px;font-weight:700;letter-spacing:.06em;font-size:16px;} /* zero-asset text-wordmark fallback — keep */
#report .rpt-logo img{max-height:44px;width:auto;}
#report .rpt-hd h1{font-size:24px;margin:11px 0 4px;font-weight:600;letter-spacing:0;}
#report .rpt-sub{color:#d6efdd;font-size:13px;margin:0;}

/* --- Meta table --- */
#report .rpt-meta{width:100%;border-collapse:collapse;margin:14px 0;font-size:12px;}
#report .rpt-meta td{border:1px solid var(--brand-line);padding:5px 9px;}
#report .rpt-meta td:first-child{background:var(--brand-soft);font-weight:600;width:28%;color:var(--brand-gray-d);}

/* --- Verdict banner --- */
#report .rpt-verdict{border-radius:8px;padding:11px 16px;margin:14px 0;border:1px solid;border-left-width:5px;}
#report .rpt-verdict.pass{background:var(--brand-green-soft);border-color:var(--brand-green);}
#report .rpt-verdict.fail{background:var(--danger-soft);border-color:var(--brand-red);}
#report .rpt-vtitle{font-weight:700;font-size:15px;}
#report .rpt-verdict.pass .rpt-vtitle{color:var(--brand-green-dark);}
#report .rpt-verdict.fail .rpt-vtitle{color:#a5160b;}
#report .rpt-verdict p{margin:.3rem 0 0;font-size:12px;}

/* --- Stat tiles --- */
#report .rpt-tiles{display:flex;gap:8px;margin:14px 0;}
#report .rpt-tiles .tile{flex:1;text-align:center;border:1px solid var(--brand-line);border-radius:8px;padding:8px 4px;background:#f7f9f7;}
#report .rpt-tiles .tile b{display:block;font-size:23px;line-height:1;}
#report .rpt-tiles .tile span{font-size:9px;letter-spacing:.08em;color:var(--brand-muted);}
#report .rpt-tiles .tile.pass b{color:var(--brand-green);}
#report .rpt-tiles .tile.fail b{color:var(--brand-red);}
#report .rpt-tiles .tile.blk b{color:var(--brand-orange);}
#report .rpt-tiles .tile.na b{color:var(--brand-gray-d);}
#report .rpt-tiles .tile.nr b{color:#8a8f8b;}

/* --- Section heading --- */
#report .rpt-h2{font-size:16px;color:var(--brand-green);border-bottom:2px solid var(--brand-green-light);padding-bottom:3px;margin:20px 0 4px;font-weight:600;}

/* --- Version / note lines (release-info vocabulary) --- */
#report .rpt-ver{font-family:Consolas,monospace;font-size:12.5px;font-weight:700;color:var(--brand-green-dark);margin:10px 0 4px;}
#report .rpt-note{font-style:italic;color:var(--brand-gray-d);font-size:12.5px;margin:6px 0;}

/* --- Prose lists inside .rpt --- */
#report .rpt ul{margin:5px 0 8px 0;padding-left:22px;}
#report .rpt li{margin:3px 0;font-size:12.5px;line-height:1.45;}
#report .rpt .tk{font-weight:700;color:var(--brand-green-dark);}
#report .rpt .sub-ul{border-left:3px solid var(--brand-green-soft);padding-left:14px;margin-left:6px;}
#report .rpt .prose{font-size:12.5px;line-height:1.5;white-space:pre-wrap;margin:6px 0;}
#report .rpt .empty{color:#8a8f8b;font-style:italic;font-size:12px;}

/* --- Affected modules table (release-info vocabulary) --- */
#report .rpt-aff{width:100%;border-collapse:collapse;margin:8px 0;font-size:12px;}
#report .rpt-aff td{border:1px solid var(--brand-line);padding:5px 9px;vertical-align:top;}
#report .rpt-aff td:first-child{width:34%;font-weight:700;color:var(--brand-green-dark);font-family:Consolas,monospace;}
#report .rpt-aff .m{white-space:pre-wrap;font-family:Consolas,monospace;}

/* --- Results table (unit-test vocabulary; sign-off is table.rpt-sign below) --- */
#report .rpt-tbl{width:100%;border-collapse:collapse;font-size:10.5px;}
#report .rpt-tbl th,#report .rpt-tbl td{border:1px solid var(--brand-line);padding:3px 6px;text-align:left;vertical-align:top;}
#report .rpt-tbl th{background:var(--brand-green-soft);color:var(--brand-green-dark);}

/* --- Footer --- */
#report .rpt-foot{font-size:9px;color:var(--brand-muted);margin-top:18px;border-top:1px solid var(--brand-line);padding-top:8px;}

/* --- New vocabulary for redesigned report builders --- */
#report .rpt-badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:11px;font-weight:700;letter-spacing:.02em;}
#report .rpt-badge.pass{background:var(--brand-green-soft);color:var(--brand-green-dark);border:1px solid #bfe0c9;}
#report .rpt-badge.fail{background:var(--danger-soft);color:#8a1c12;border:1px solid var(--danger-line);}
#report .rpt-badge.blk{background:var(--warn-soft);color:#7a5200;border:1px solid var(--warn-line);}
#report .rpt-badge.na{background:var(--brand-soft);color:var(--brand-gray-d);border:1px solid var(--brand-line);}
#report .rpt-badge.info{background:var(--brand-blue-soft);color:var(--brand-blue);border:1px solid var(--brand-blue-line);}
#report ul.rpt-timeline{margin:10px 0;padding:0 0 0 18px;border-left:2px solid var(--brand-green-light);list-style:none;}
#report ul.rpt-timeline li{position:relative;padding:0 0 10px 12px;font-size:12.5px;}
#report ul.rpt-timeline li::before{content:"";position:absolute;left:-23px;top:3px;width:9px;height:9px;border-radius:50%;background:var(--brand-green);box-shadow:0 0 0 2px var(--brand-green);border:2px solid #fff;}
#report ul.rpt-timeline .when{font-size:10.5px;color:var(--brand-muted);text-transform:uppercase;letter-spacing:.05em;display:block;}
#report table.rpt-sign{width:100%;border-collapse:collapse;margin:14px 0;font-size:12px;}
#report table.rpt-sign td{border:1px solid var(--brand-line);padding:8px 9px;}
#report table.rpt-sign td:first-child{background:var(--brand-soft);font-weight:600;width:32%;color:var(--brand-gray-d);}

/* --- Print --- */
@media print{
  #report .rpt-hd,#report .rpt-h2,#report .rpt-tbl th,#report table.rpt-sign td:first-child,#report .rpt-meta td:first-child,#report .rpt-tiles .tile,#report .rpt-verdict,#report .rpt-badge{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  #report .rpt-tbl tr,#report .rpt-sign tr{page-break-inside:avoid;}
  #report .rpt ul,#report .rpt li{page-break-inside:avoid;}
}
/* BRAND-REPORT-CSS:END */
#report{display:none;}
@media print{
  body{padding:0;background:#fff;}
  #loadNotice,#preamble,#runHeader,#dashboard,#cases,#signoff{display:none !important;}
  #report{display:block !important;}
  .rpt-hd,.rpt-h2,.rpt-tbl th,.rpt-sign th,.rpt-meta td:first-child,.rpt-tiles .tile,.rpt-verdict{
    -webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .rpt-tbl tr,.rpt-sign tr{page-break-inside:avoid;}
}
</style></head><body><div class="wrap">
  <!-- >>> CUSTOMIZE: title + one-line subtitle <<< -->
  <h1>Clarion LSP MCP — Live Run in Claude Code</h1>
  <p class="sub">Manual test protocol with the Clarion IDE closed &middot; tick steps, record verdicts, print a PDF report.</p>
  <div id="loadNotice"></div>
  <div id="preamble"></div>
  <div id="runHeader"></div>
  <div id="dashboard"></div>
  <div id="cases"></div>
  <div id="report"></div>
  <div id="signoff"></div>
</div>
<script>
"use strict";

/* ============================ CUSTOMIZE START ============================ */
var SCHEMA_VERSION = "v1";          // bump ONLY on a breaking change to the CASES shape
var SUITE_ID = "clarion-lsp-mcp";   // stable lowercase slug — keys localStorage
var STORAGE_KEY = "uts:" + SUITE_ID + ":" + SCHEMA_VERSION;
var SUITE_TITLE = "Clarion LSP MCP — Live Run in Claude Code";   // heading on the printed report

// Sections drive the filter dropdown. One key per logical group of cases.
var SECTIONS = [
  {key:"setup", label:"Install and register"},
  {key:"open",  label:"Opening a solution"},
  {key:"nav",   label:"Code navigation"},
  {key:"diag",  label:"Diagnostics and edits"},
  {key:"fail",  label:"Failure handling and recovery"},
  {key:"skill", label:"Plugin skill compatibility"}
];

// One object per test case. RULE: one source-numbered action = one steps[] entry = one checkbox.
// priority is "CORE" | "HIGH" | "MED". section must match a SECTIONS key.
var CASES = [
  { id:"TC-01", section:"setup", priority:"CORE",
    title:"Confirm the workstation prerequisites",
    pre:"A Windows PC with Clarion 12 (or 11.1) installed and the Clarion Assistant IDE addin present. Node.js installed. A real Clarion solution folder to test with (record its .sln path in the run header).",
    steps:[
      "Close the Clarion IDE. Open Task Manager, Details tab, and confirm there is no Clarion.exe process running.",
      "Open a command prompt and run: node --version",
      "In File Explorer, browse to C:\\Clarion12\\accessory\\addins\\ClarionAssistant\\lsp-server (substitute your Clarion folder) and confirm node.exe exists there and the file out\\server\\src\\server.js exists beneath it.",
      "In the command prompt run: claude --version"
    ],
    expected:"No Clarion.exe process. node --version prints v20 or higher. The lsp-server folder contains node.exe and out\\server\\src\\server.js. claude --version prints a version. If node is missing or older than v20, record BLOCKED and install the current Node LTS before continuing." },

  { id:"TC-02", section:"setup", priority:"CORE",
    title:"Register the server with Claude Code",
    pre:"TC-01 passed. Decide whether you are testing a local build or the published npm package; record which in the run header Build field. The npm form only works after the package has been published: check with   npm view clarion-lsp-mcp version   and if that prints a 404, use the local build.",
    steps:[
      "For a local build, first run in the repo folder: npm run build   then register from any folder: claude mcp add -s user clarion-lsp -- node C:\\Projects\\GitHub\\clarion-lsp-mcp\\dist\\index.js   (adjust the path). For the published npm package, run instead: claude mcp add -s user clarion-lsp -- cmd /c npx -y clarion-lsp-mcp",
      "Run: claude mcp list",
      "Run: claude mcp get clarion-lsp"
    ],
    expected:"claude mcp list shows clarion-lsp. claude mcp get clarion-lsp shows Status: Connected, scope User config, and the command you registered. If it shows failed, disconnected, or CONNECTION_CLOSED, the command could not start: for the npm form that means the package is not published yet (re-register with the local build); for the local build run   node <path>\\dist\\index.js   by hand and paste whatever it prints into Notes, then record FAIL. If claude mcp get shows the right command but a Claude Code session still fails, look for a .mcp.json in the solution folder or any parent folder: a project-scope entry there overrides the user-scope one. Remove or correct it, then restart the session." },

  { id:"TC-03", section:"setup", priority:"CORE",
    title:"Tools are visible inside a Claude Code session",
    pre:"TC-02 passed.",
    steps:[
      "In the command prompt, change directory to the folder that contains the test solution's .sln file.",
      "Run: claude   (start an interactive session).",
      "Type: /mcp   and open the clarion-lsp entry."
    ],
    expected:"The clarion-lsp server shows as connected and lists twelve tools: open_solution, lsp_start, get_solution_info, lsp_debug_status, lsp_definition, lsp_references, lsp_hover, lsp_document_symbols, lsp_find_symbol, lsp_rename, lsp_diagnostics, get_project_source_files. If the server shows as failed, record FAIL and copy the error text shown into Notes." },

  { id:"TC-04", section:"open", priority:"CORE",
    title:"Open the solution and reach ready",
    pre:"TC-03 passed. You are in the Claude Code session started inside the solution folder. Clarion IDE is closed.",
    steps:[
      "Type: Open the Clarion solution in this folder using the open_solution tool and show me the raw result.",
      "When Claude Code asks permission to run the tool, allow it.",
      "Read the tool result Claude shows. Note the value of ready, clarionRoot, clarionVersion, and redirectionFile."
    ],
    expected:"The result shows ready: true, solution equal to your .sln path, clarionRoot equal to your Clarion install folder, a clarionVersion such as 12.0.0.14000, and a redirectionFile path ending in .red. There is no stderrTail field. If ready is false, wait one minute and rerun TC-05 before recording; a large solution may still be indexing. If the result is an error mentioning CLARION_ROOT or the Clarion Assistant addin, record FAIL and paste the message into Notes." },

  { id:"TC-05", section:"open", priority:"CORE",
    title:"Status tools report a live server",
    pre:"TC-04 completed.",
    steps:[
      "Type: Call get_solution_info and show me the raw result.",
      "Type: Call lsp_debug_status and show me the raw result.",
      "Write down the pid value from lsp_debug_status; TC-17 compares against it."
    ],
    expected:"get_solution_info shows the same solution path and ready value as TC-04. lsp_debug_status shows running: true, a numeric pid, and notifications greater than 0. If running is false, record FAIL and paste stderrTail into Notes." },

  { id:"TC-06", section:"open", priority:"CORE",
    title:"Project source files are listed with absolute paths",
    pre:"TC-04 completed. Know the name of at least one .clw file in the solution.",
    steps:[
      "Type: Call get_project_source_files and show me the raw result.",
      "Count the projects returned and compare with the projects in the .sln (open the .sln in Notepad; each Project(...) line with a .cwproj is one project).",
      "Search the result for the .clw file name you know."
    ],
    expected:"One entry per .cwproj project, each with a files list of absolute paths ending in .clw or .inc, and an unresolved list. The known .clw appears with its full path. unresolved is normally empty; if it is not, check whether each named file exists anywhere under the solution folder. A name that exists on disk but is listed as unresolved is a FAIL; a name that does not exist (for example source not yet generated) is a PASS with the names pasted into Notes." },

  { id:"TC-07", section:"nav", priority:"CORE",
    title:"Document symbols for a source file",
    pre:"TC-06 completed. Pick one .clw from the list that contains at least one PROCEDURE; open it in Notepad and note two procedure names.",
    steps:[
      "Type: Call lsp_document_symbols on <full path of the .clw> and show me the raw result.",
      "Search the result for the two procedure names you noted."
    ],
    expected:"Both procedure names appear with a kind number and a zero-based line. The line for each, plus one, matches the line number shown in Notepad's status bar for that procedure. If the list is empty, record FAIL." },

  { id:"TC-08", section:"nav", priority:"CORE",
    title:"Go to definition across files",
    pre:"TC-07 completed. In the same .clw, find a line that CALLS a procedure defined elsewhere in the solution (or in the same file). Note the file, the line number from Notepad, and the column of the procedure name.",
    steps:[
      "Type: Call lsp_definition on <full path>, line <Notepad line minus 1>, character <column minus 1> and show me the raw result.",
      "Write down the file, line and character you used; TC-09, TC-10, TC-14 and TC-17 reuse them.",
      "Open the file_path the result names in Notepad and go to the result line plus one."
    ],
    expected:"The result is a list with at least one entry, and the file and line it names is where the procedure is declared or implemented. If the list is empty, record FAIL and note the exact line and character you used." },

  { id:"TC-09", section:"nav", priority:"HIGH",
    title:"Find references matches a manual search",
    pre:"TC-08 completed. Use the same procedure name.",
    steps:[
      "Open a second command prompt in the solution folder (leave Claude Code running in the first) and run: findstr /s /i /n /c:\"<ProcedureName>\" *.clw *.inc   Keep this window open; it lists file:line for every occurrence.",
      "Type in Claude Code: Call lsp_references at the position from TC-08 and show me the raw result.",
      "For each entry in the result, find its file and line plus one in the findstr output."
    ],
    expected:"The result has at least one entry, and every entry's file and line (plus one) appears in the findstr output. If the result is empty while findstr found the name in more than one place, or an entry points at a file and line findstr did not list, record FAIL and paste both outputs into Notes." },

  { id:"TC-10", section:"nav", priority:"HIGH",
    title:"Hover returns a signature",
    pre:"TC-08 completed.",
    steps:[
      "Type: Call lsp_hover at the position from TC-08 and show me the raw result."
    ],
    expected:"The result has a contents string that is not empty and mentions the procedure name, and usually its prototype. If contents is an empty string, record FAIL." },

  { id:"TC-11", section:"nav", priority:"HIGH",
    title:"Workspace symbol search by name",
    pre:"TC-07 completed.",
    steps:[
      "Type: Call lsp_find_symbol with query <first four letters of the procedure name> and show me the raw result."
    ],
    expected:"The result lists at least one symbol whose name contains the query, each with file_path and line. The procedure from TC-07 is among them. If the list is empty, record FAIL." },

  { id:"TC-12", section:"diag", priority:"CORE",
    title:"Diagnostics on an unchanged file",
    pre:"TC-07 completed. Use the same .clw.",
    steps:[
      "Type: Call lsp_diagnostics on <full path of the .clw> and show me the raw result.",

var loadError = false, storageOK = true, saveTimer = null;

function timeNow(){
  var d = new Date(), p = function(n){ return (n<10?"0":"")+n; };
  return p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds());
}

function loadState(){
  var raw = null;
  try { raw = localStorage.getItem(STORAGE_KEY); } catch(e){ storageOK = false; }
  if(!raw) return freshState();
  var s;
  try { s = JSON.parse(raw); }
  catch(e){ loadError = true; return freshState(); }   // unparseable — don't wipe; show notice
  return hydrate(s);
}

// Merge valid values over a fresh skeleton so a drifted/partial save never throws at render.
function hydrate(s){
  var fresh = freshState();
  if(!s || typeof s !== "object"){ loadError = true; return fresh; }
  if(s.header && typeof s.header === "object"){
    Object.keys(fresh.header).forEach(function(k){
      if(typeof s.header[k] === "string") fresh.header[k] = s.header[k];
    });
  }
  if(s.signoff && typeof s.signoff === "object"){
    Object.keys(fresh.signoff).forEach(function(role){
      var src = s.signoff[role]; if(!src) return;
      ["name","date","result"].forEach(function(fld){
        if(typeof src[fld] === "string") fresh.signoff[role][fld] = src[fld];
      });
    });
  }
  if(s.cases && typeof s.cases === "object"){
    CASES.forEach(function(c){
      var src = s.cases[c.id]; if(!src) return;
      var dst = fresh.cases[c.id];
      if(["PASS","FAIL","BLOCKED","NA",""].indexOf(src.verdict) !== -1) dst.verdict = src.verdict;
      if(typeof src.notes === "string") dst.notes = src.notes;
      if(typeof src.evidence === "string") dst.evidence = src.evidence;
      if(Array.isArray(src.steps) && src.steps.length === dst.steps.length){
        dst.steps = src.steps.map(function(b){ return !!b; });
      }
    });
  }
  fresh.resumed = true;
  return fresh;
}

function flushState(){
  if(loadError) return;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); storageOK = true; setSaveStatus("Saved " + timeNow()); }
  catch(e){ storageOK = false; setSaveStatus("Not saving — print before you close"); }
}
function saveState(){ clearTimeout(saveTimer); saveTimer = setTimeout(flushState, 400); }

var state = loadState();
window.addEventListener("pagehide", flushState);
document.addEventListener("visibilitychange", function(){ if(document.visibilityState === "hidden") flushState(); });
window.addEventListener("beforeprint", flushState);

function setSaveStatus(msg){
  var el = document.getElementById("saveStatus");
  if(el){ el.textContent = msg; el.className = storageOK ? "ok" : "warn-text"; }
}
function bindHeaderInput(key){ return function(e){ state.header[key] = e.target.value; saveState(); }; }
function renderHeader(){
  var rows = HEADER_FIELDS.map(function(f){
    return '<label class="hf">'+f[1]+'<input id="h_'+f[0]+'" value="'+esc(state.header[f[0]])+'"></label>';
  }).join("");
  var resume = state.resumed ? '<span class="resume">Resumed run — last-saved data restored</span>' : '';
  document.getElementById("runHeader").innerHTML =
    '<div class="runhdr"><div class="hgrid">'+rows+'</div>'+
    '<div class="hstatus">'+resume+'<span id="saveStatus"></span></div></div>';
  HEADER_FIELDS.forEach(function(f){
    document.getElementById("h_"+f[0]).addEventListener("input", bindHeaderInput(f[0]));
  });
}

function renderSignoff(){
  var rows = SIGN_ROLES.map(function(r){
    var s = state.signoff[r[0]];
    return '<tr><td>'+r[1]+'</td>'+
      '<td><input class="sign" data-role="'+r[0]+'" data-field="name" value="'+esc(s.name)+'"></td>'+
      '<td><input class="sign" data-role="'+r[0]+'" data-field="date" value="'+esc(s.date)+'"></td>'+
      '<td><input class="sign" data-role="'+r[0]+'" data-field="result" value="'+esc(s.result)+'"></td></tr>';
  }).join("");
  document.getElementById("signoff").innerHTML =
    '<h2 class="sec">Sign-off</h2><table class="signtbl"><tr><th>Role</th><th>Name</th>'+
    '<th>Date</th><th>Result</th></tr>'+rows+'</table>';
}
var signBound = false;
function bindSignDelegation(){
  if(signBound) return; signBound = true;
  document.getElementById("signoff").addEventListener("input", function(e){
    var el = e.target; if(!el.classList.contains("sign")) return;
    state.signoff[el.getAttribute("data-role")][el.getAttribute("data-field")] = el.value;
    saveState();
  });
}

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
var VERDICTS = ["PASS","FAIL","BLOCKED","NA"];

function toggleStep(id, i, checked){ state.cases[id].steps[i] = checked; saveState(); afterChange(id); }
function setVerdict(id, v){ state.cases[id].verdict = v; saveState(); afterChange(id); }
function setField(id, field, val){ state.cases[id][field] = val; saveState(); afterChange(id); }

function renderCase(c){
  var st = state.cases[c.id];
  var stepsHtml = c.steps.map(function(s, i){
    var ck = st.steps[i] ? " checked" : "";
    return '<li><label><input type="checkbox" class="step-cb" data-id="'+c.id+'" data-i="'+i+'"'+ck+'> '+esc(s)+'</label></li>';
  }).join("");
  var verdictHtml = VERDICTS.map(function(v){
    var ck = (st.verdict===v) ? " checked" : "";
    return '<label><input type="radio" class="verdict-radio" name="v_'+c.id+'" value="'+v+'" data-id="'+c.id+'"'+ck+'> '+v+'</label>';
  }).join("");
  return '<div class="case" id="case_'+c.id+'" data-section="'+c.section+'">'+
     '<h3>'+c.id+' — '+esc(c.title)+'<span class="pill '+c.priority+'">'+c.priority+'</span>'+
        '<span class="chip" id="chip_'+c.id+'"></span>'+
        '<span class="stepcount" id="sc_'+c.id+'"></span><span id="fl_'+c.id+'"></span></h3>'+
     '<div class="body-collapsible">'+
       '<div class="ro"><b>Pre</b> <span class="escaped">'+esc(c.pre)+'</span></div>'+
       '<div class="ro"><b>Steps</b><ul class="steplist">'+stepsHtml+'</ul></div>'+
       '<div class="ro"><b>Expected</b> <span class="escaped">'+esc(c.expected)+'</span></div>'+
       '<div class="verdict">'+verdictHtml+'</div>'+
       '<textarea rows="2" class="notes-ta" data-id="'+c.id+'" placeholder="Notes">'+esc(st.notes)+'</textarea>'+
       '<textarea rows="2" class="evid-ta" data-id="'+c.id+'" placeholder="Evidence (log line / count / screenshot file)">'+esc(st.evidence)+'</textarea>'+
     '</div></div>';
}

function renderCases(){
  var mount = document.getElementById("cases");
  mount.innerHTML = CASES.map(renderCase).join("");
  CASES.forEach(function(c){ updateCard(c.id); });
  applyFilter(activeFilter);
}

var casesBound = false;
function bindCaseDelegation(){
  if(casesBound) return; casesBound = true;
  var mount = document.getElementById("cases");
  mount.addEventListener("change", function(e){
    var el = e.target, id = el.getAttribute("data-id"); if(!id) return;
    if(el.classList.contains("step-cb")) toggleStep(id, +el.getAttribute("data-i"), el.checked);
    else if(el.classList.contains("verdict-radio")) setVerdict(id, el.value);
  });
  mount.addEventListener("input", function(e){
    var el = e.target, id = el.getAttribute("data-id"); if(!id) return;
    if(el.classList.contains("notes-ta")) setField(id, "notes", el.value);
    else if(el.classList.contains("evid-ta")) setField(id, "evidence", el.value);
  });
}
function updateChip(id){
  var el = document.getElementById("chip_"+id); if(!el) return;
  var v = state.cases[id].verdict;
  el.textContent = verdictLabel(v);
  el.className = "chip " + (v || "NOTRUN");
}
function afterChange(id){ updateCard(id); recompute(); }
function updateCard(id){ updateChip(id); updateStepCount(id); updateFlags(id); }

function stepStats(id){
  var arr = state.cases[id].steps, done = 0;
  arr.forEach(function(b){ if(b) done++; });
  return { done: done, total: arr.length };
}
function updateStepCount(id){
  var el = document.getElementById("sc_"+id); if(!el) return;
  var s = stepStats(id);
  el.textContent = " " + s.done + "/" + s.total + " steps" + (s.done===s.total ? " ✓" : "");
  el.className = "stepcount" + (s.done===s.total ? " full" : "");
}
function caseFlags(id){
  var c = state.cases[id], s = stepStats(id), flags = [];
  if(c.verdict==="PASS" && s.done < s.total) flags.push("PASS with " + (s.total-s.done) + " step(s) un-ticked");
  if((c.verdict==="FAIL" || c.verdict==="BLOCKED" || c.verdict==="NA") && !c.notes.trim())
    flags.push("Note required for " + c.verdict);
  return flags;
}
function updateFlags(id){
  var el = document.getElementById("fl_"+id); if(!el) return;
  el.innerHTML = caseFlags(id).map(function(f){ return '<span class="flag">'+esc(f)+'</span>'; }).join("");
}

var activeFilter = "all";
function tally(){
  var t = {PASS:0,FAIL:0,BLOCKED:0,NA:0,NOTRUN:0};
  CASES.forEach(function(c){ var v = state.cases[c.id].verdict || "NOTRUN"; t[v] = (t[v]||0) + 1; });
  return t;
}
function passRate(t){ var d = t.PASS + t.FAIL + t.BLOCKED; return d ? Math.round((t.PASS/d)*100) : 0; }
function completion(t){ return Math.round(((t.PASS+t.FAIL+t.BLOCKED+t.NA)/CASES.length)*100); }

function renderDashboard(){
  var secOpts = '<option value="all">All sections</option>'+
    '<option value="notrun">Not-run only</option><option value="failed">Failed only</option>'+
    SECTIONS.map(function(s){ return '<option value="sec:'+s.key+'">'+s.label+'</option>'; }).join("");
  document.getElementById("dashboard").innerHTML =
    '<div class="dash"><div id="counts"></div>'+
    '<div class="bar"><div id="barFill"></div></div>'+
    '<div class="dashctl">Filter: <select id="filter" onchange="applyFilter(this.value)">'+secOpts+'</select>'+
    '<button onclick="printReport()">Generate PDF Report</button>'+
    '<button onclick="newRun()">New Run / Clear All</button>'+
    '<button onclick="toggleAll()">Collapse / Expand</button></div></div>';
  recompute();
}
function recompute(){
  var t = tally(), el = document.getElementById("counts");
  if(el){
    el.innerHTML = '<b>Pass '+t.PASS+'</b> · Fail '+t.FAIL+' · Blocked '+t.BLOCKED+' · N/A '+t.NA+
      ' · Not-run '+t.NOTRUN+'  —  Pass-rate '+passRate(t)+'% (of Pass+Fail+Blocked) · Completion '+completion(t)+'%';
  }
  var bar = document.getElementById("barFill");
  if(bar) bar.style.width = completion(t) + "%";
}
function applyFilter(f){
  activeFilter = f;
  CASES.forEach(function(c){
    var card = document.getElementById("case_"+c.id); if(!card) return;
    var v = state.cases[c.id].verdict;
    var show = (f==="all") || (f==="notrun" && !v) || (f==="failed" && v==="FAIL") ||
      (f.indexOf("sec:")===0 && c.section===f.slice(4));
    card.style.display = show ? "" : "none";
  });
}

function renderLoadNotice(){
  var el = document.getElementById("loadNotice");
  if(loadError){
    el.innerHTML = '<div class="notice">Saved data for this run could not be read. Auto-save is paused to avoid destroying it. '+
      '<button onclick="startFreshAfterError()">Start a fresh run (clears it)</button></div>';
  } else { el.innerHTML = ""; }
}
function startFreshAfterError(){
  try { localStorage.removeItem(STORAGE_KEY); } catch(e){}
  loadError = false; state = freshState(); renderAll();
}

var allCollapsed = false;
function toggleAll(){
  allCollapsed = !allCollapsed;
  document.querySelectorAll(".case .body-collapsible").forEach(function(b){ b.style.display = allCollapsed ? "none" : ""; });
}

function printReport(){ flushState(); buildReport(); window.print(); }

function newRun(){
  if(!window.confirm("Start a NEW run? This clears the current run's verdicts, notes, and header. Print the PDF first if you need the current results.")) return;
  try { localStorage.removeItem(STORAGE_KEY); } catch(e){}
  loadError = false; state = freshState(); state.resumed = false; renderAll();
}

function verdictLabel(v){ return v || "Not run"; }

function badgeCell(v){
  var map = {PASS:["pass","PASS"],FAIL:["fail","FAIL"],BLOCKED:["blk","BLOCKED"],NA:["na","N/A"]};
  var m = map[v] || ["na","NOT RUN"];
  return '<span class="rpt-badge '+m[0]+'">'+m[1]+'</span>';
}
function clearedToMerge(){   // cleared = every CORE and HIGH case is PASS
  return CASES.every(function(c){
    return !(c.priority==="CORE"||c.priority==="HIGH") || state.cases[c.id].verdict==="PASS";
  });
}
function genStamp(){
  var d = new Date(), p = function(n){ return (n<10?"0":"")+n; };
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
}

function buildReport(){
  var t = tally(), h = state.header;

  var meta = '<tr><td>Feature</td><td>'+esc(SUITE_TITLE)+'</td></tr>';
  meta += HEADER_FIELDS.map(function(f){ return '<tr><td>'+f[1]+'</td><td>'+esc(h[f[0]]||"—")+'</td></tr>'; }).join("");
  meta += '<tr><td>Report generated</td><td>'+genStamp()+'</td></tr>';

  var blockers = CASES.filter(function(c){
    return (c.priority==="CORE"||c.priority==="HIGH") && state.cases[c.id].verdict!=="PASS";
  });
  var verdict;
  if(clearedToMerge()){
    verdict = '<div class="rpt-verdict pass"><div class="rpt-vtitle">PASS &mdash; cleared to merge</div>'+
      '<p>All CORE and HIGH priority cases passed.</p></div>';
  } else {
    var bl = blockers.map(function(c){ return c.id+' ('+verdictLabel(state.cases[c.id].verdict)+')'; }).join(', ');
    verdict = '<div class="rpt-verdict fail"><div class="rpt-vtitle">NOT CLEARED &mdash; '+blockers.length+' CORE/HIGH case(s) outstanding</div>'+
      '<p>Resolve before merge: '+esc(bl)+'.</p></div>';
  }

  var tiles = '<div class="rpt-tiles">'+
    '<div class="tile pass"><b>'+t.PASS+'</b><span>PASS</span></div>'+
    '<div class="tile fail"><b>'+t.FAIL+'</b><span>FAIL</span></div>'+
    '<div class="tile blk"><b>'+t.BLOCKED+'</b><span>BLOCKED</span></div>'+
    '<div class="tile na"><b>'+t.NA+'</b><span>N/A</span></div>'+
    '<div class="tile nr"><b>'+t.NOTRUN+'</b><span>NOT RUN</span></div></div>';

  var rows = CASES.map(function(c){
    var st = state.cases[c.id];
    var note = esc(st.notes);
    if(st.evidence.trim()) note += (note?' &middot; ':'')+'<i>Ev:</i> '+esc(st.evidence);
    return '<tr><td>'+c.id+'</td><td>'+c.priority+'</td><td>'+badgeCell(st.verdict)+'</td>'+
      '<td>'+esc(c.title)+'</td><td>'+(note||'—')+'</td></tr>';
  }).join("");

  var sign = SIGN_ROLES.map(function(r){
    var s = state.signoff[r[0]];
    return '<tr><td>'+r[1]+'</td><td>'+(esc(s.name)||"—")+' &middot; '+(esc(s.date)||"—")+' &middot; '+(esc(s.result)||"—")+'</td></tr>';
  }).join("");

  document.getElementById("report").innerHTML =
    '<div class="rpt">'+
      '<header class="rpt-hd"><div class="rpt-logo">'+RPT_LOGO+'</div>'+
        '<h1>'+esc(SUITE_TITLE)+' &mdash; Test Completion Report</h1>'+
        '<p class="rpt-sub">Test results &mdash; a dated, signed completion report.</p></header>'+
      '<table class="rpt-meta">'+meta+'</table>'+
      verdict + tiles +
      '<h2 class="rpt-h2">Results detail</h2>'+
      '<table class="rpt-tbl"><tr><th>Case</th><th>Priority</th><th>Result</th><th>Title</th><th>Notes</th></tr>'+rows+'</table>'+
      '<h2 class="rpt-h2">Sign-off</h2>'+
      '<table class="rpt-sign">'+sign+'</table>'+
      '<p class="rpt-foot">Dollar Tree &middot; '+esc(SUITE_TITLE)+'. Test cases mirror the QA Testing Guide (single source of truth). Self-contained; results stored only in this browser until you print or export.</p>'+
    '</div>';
}
// RPT-BUILDER:END

function renderAll(){
  bindCaseDelegation(); bindSignDelegation();
  renderPreamble(); renderLoadNotice(); renderHeader(); renderSignoff();
  renderDashboard(); renderCases();
  setSaveStatus(state.resumed ? "Resumed run from saved data" : "Ready");
}
renderAll();
</script>
